server:
  port: 8080

spring:
  datasource:
    # Defaults target the local (Homebrew) Postgres on 5432.
    # Override via SPRING_DATASOURCE_* env vars in any non-local deployment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kubemind}
    username: ${SPRING_DATASOURCE_USERNAME:kubemind}
    password: ${SPRING_DATASOURCE_PASSWORD:kubemind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.kubemind: INFO

# Phase 0 local admin seeding. Set KUBEMIND_ADMIN_PASSWORD in backend/.env (loaded via spring-dotenv).
# If the password is empty, NO admin user is created -> non-local deployments have no default credential.
kubemind:
  admin:
    username: ${KUBEMIND_ADMIN_USERNAME:admin}
    password: ${KUBEMIND_ADMIN_PASSWORD:}
