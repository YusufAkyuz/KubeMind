server:
  port: 8080
  # Nginx (see deploy/docker/nginx.conf.template) sets X-Forwarded-Proto/Host
  # on every request it proxies. Without this, OIDC's redirect_uri would be
  # computed from the internal http://backend:8080 address Tomcat actually
  # sees rather than the external https:// one the IdP needs to call back to.
  # Harmless when unproxied (local `mvn spring-boot:run`) — those headers
  # simply aren't sent, so this has no effect there.
  forward-headers-strategy: framework

spring:
  mvc:
    async:
      # Streaming AI responses (chat, draft, analyze, edit-with-AI) hold the request thread
      # open for as long as Ollama takes to generate. Tomcat/Spring's own default (30s) is
      # comfortably shorter than a long response from a local 7B model, especially once RAG
      # reference material grows the prompt — that mid-stream cutoff is what an
      # InterruptedException with no message downstream in AiStreaming means.
      request-timeout: 300000
  datasource:
    # Defaults target the local (Homebrew) Postgres on 5432.
    # Override via SPRING_DATASOURCE_* env vars in any non-local deployment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kubemind}
    username: ${SPRING_DATASOURCE_USERNAME:kubemind}
    password: ${SPRING_DATASOURCE_PASSWORD:kubemind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        # Schema is created by Flyway (V6__pgvector.sql), not by Spring AI, so every
        # schema change stays reviewable and versioned like the rest of this app's tables.
        initialize-schema: false
        dimensions: 768
        index-type: hnsw
        distance-type: cosine-distance

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.kubemind: INFO

# Phase 0 local admin seeding. Set KUBEMIND_ADMIN_PASSWORD in backend/.env (loaded via spring-dotenv).
# If the password is empty, NO admin user is created -> non-local deployments have no default credential.
kubemind:
  # Filled in at build time from pom.xml (spring-boot-starter-parent filters
  # application*.yml with @...@). ${application.version} would only resolve from
  # a packaged jar's manifest, so it comes out blank under `mvn spring-boot:run`.
  version: @project.version@
  admin:
    username: ${KUBEMIND_ADMIN_USERNAME:admin}
    password: ${KUBEMIND_ADMIN_PASSWORD:}
  encryption:
    # base64-encoded 32 bytes (openssl rand -base64 32). Empty -> remote cluster
    # registration is disabled; the built-in local cluster keeps working.
    key: ${KUBEMIND_ENCRYPTION_KEY:}
  privileged-features:
    # The three surfaces that cannot exist without cluster-admin-equivalent power:
    # the Cluster Terminal (binds its own SA to cluster-admin), the Node Shell
    # (privileged host-mounted debug pods), and writing RBAC objects (anyone who
    # can create a ClusterRoleBinding can make themselves cluster-admin).
    #
    # false -> those three are switched off app-wide and the endpoints reject the
    # calls, so KubeMind can run against a ServiceAccount that is NOT cluster-admin.
    # Default true keeps the existing behaviour for current installs.
    enabled: ${KUBEMIND_PRIVILEGED_FEATURES:true}
  oidc:
    # All blank by default -> OidcClientConfig builds no ClientRegistrationRepository
    # bean at all, which is what actually gates .oauth2Login() in SecurityConfig (a
    # plain null-check, not @ConditionalOnProperty — an empty string here must not
    # be mistaken for "configured").
    #
    # These MUST be referenced by name like this (${KUBEMIND_OIDC_...}), the same
    # way KUBEMIND_ENCRYPTION_KEY is above. Spring's relaxed binding (env var name
    # -> dotted property path) only auto-applies to a real SystemEnvironmentPropertySource;
    # spring-dotenv's .env loader isn't one, so without an explicit reference here
    # a value set only in backend/.env is silently invisible to KubemindOidcProperties.
    issuer-uri: ${KUBEMIND_OIDC_ISSUER_URI:}
    client-id: ${KUBEMIND_OIDC_CLIENT_ID:}
    client-secret: ${KUBEMIND_OIDC_CLIENT_SECRET:}
    groups-claim: ${KUBEMIND_OIDC_GROUPS_CLAIM:groups}
    admin-group: ${KUBEMIND_OIDC_ADMIN_GROUP:}
