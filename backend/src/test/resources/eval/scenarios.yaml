# Eval fixture set: broken-resource snapshots in the same plain-text format the
# context collectors produce (see PodContextCollector). Each scenario lists
# `expect` keyword groups — one group per line, pipe-separated alternatives,
# case-insensitive substring match against the model's answer. A scenario
# passes when EVERY group has at least one alternative present.
#
# Run: cd backend && mvn test -Dtest=EvalHarness -Deval=true
# Subset: add -Deval.filter=oom (substring match on id)

