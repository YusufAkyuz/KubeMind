services:
  postgres:
    image: postgres:16
    container_name: kubemind-postgres
    environment:
      POSTGRES_DB: kubemind
      POSTGRES_USER: kubemind
      POSTGRES_PASSWORD: kubemind
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      # Inside the container Postgres still listens on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # AI backend for "Explain this" (Phase 3).
  # On macOS prefer the native Ollama app (Metal GPU; Docker is CPU-only) — the
  # backend default http://localhost:11434 points at it. This container is the
  # fallback for machines without a native install: publish on 11435 to avoid
  # clashing, pull the model (docker exec -it kubemind-ollama ollama pull
  # qwen2.5-coder:7b) and set OLLAMA_BASE_URL=http://localhost:11435.
  ollama:
    image: ollama/ollama:latest
    container_name: kubemind-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  ollamadata:
