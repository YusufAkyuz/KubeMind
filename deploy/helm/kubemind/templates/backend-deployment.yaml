apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubemind.fullname" . }}-backend
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubemind.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "kubemind.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "kubemind.serviceAccountName" . }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      # The bundled Postgres StatefulSet can take a while to become ready (PVC
      # provisioning, first-boot initdb) — without this, the backend starts,
      # fails DB connection, and Spring/Hikari's own retry logic burns through
      # a CrashLoopBackOff cycle before ever reaching Flyway. Only added for the
      # bundled DB: an external Postgres's availability is the operator's own
      # responsibility, and there's no single well-known host:port to probe.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ include "kubemind.fullname" . }}-postgresql 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ include "kubemind.jdbcUrl" . | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ include "kubemind.dbUsername" . | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubemind.secretName" . }}
                  key: db-password
            - name: OLLAMA_BASE_URL
              value: {{ include "kubemind.ollamaBaseUrl" . | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.chatModel | quote }}
            - name: OLLAMA_EMBEDDING_MODEL
              value: {{ .Values.ollama.embeddingModel | quote }}
            # Kept in step with the RBAC the chart actually binds: without
            # cluster-admin the Cluster Terminal, Node Shell and RBAC writes
            # cannot work, so the app switches them off rather than offering
            # controls that would fail against the API server.
            - name: KUBEMIND_PRIVILEGED_FEATURES
              value: {{ .Values.rbac.clusterAdmin | quote }}
            - name: KUBEMIND_ADMIN_USERNAME
              value: {{ .Values.auth.adminUsername | quote }}
            - name: KUBEMIND_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubemind.secretName" . }}
                  key: admin-password
            - name: KUBEMIND_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubemind.secretName" . }}
                  key: encryption-key
                  optional: true
            # Optional SSO login — see values.yaml's auth.oidc block. Blank
            # issuerUri (the default) means KubemindOidcProperties.enabled()
            # is false and none of this does anything; local login is untouched.
            - name: KUBEMIND_OIDC_ISSUER_URI
              value: {{ .Values.auth.oidc.issuerUri | quote }}
            - name: KUBEMIND_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: KUBEMIND_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubemind.secretName" . }}
                  key: oidc-client-secret
                  optional: true
            - name: KUBEMIND_OIDC_GROUPS_CLAIM
              value: {{ .Values.auth.oidc.groupsClaim | quote }}
            - name: KUBEMIND_OIDC_ADMIN_GROUP
              value: {{ .Values.auth.oidc.adminGroup | quote }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemind.fullname" . }}-backend
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "kubemind.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
