{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubemind.secretName" . }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ required "auth.adminPassword is required (the chart never ships a default credential)" .Values.auth.adminPassword | quote }}
  encryption-key: {{ .Values.auth.encryptionKey | quote }}
  # Blank is fine and expected when OIDC isn't configured — see auth.oidc.issuerUri.
  oidc-client-secret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- if .Values.postgresql.enabled }}
  db-password: {{ required "postgresql.password is required when postgresql.enabled is true" .Values.postgresql.password | quote }}
  {{- else }}
  db-password: {{ required "postgresql.external.password is required when postgresql.enabled is false" .Values.postgresql.external.password | quote }}
  {{- end }}
{{- end }}
