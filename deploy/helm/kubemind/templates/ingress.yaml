{{- if .Values.ingress.enabled }}
{{- $forwardHost := .Values.portForward.subdomain.host | trimPrefix "*." | trimAll "." }}
# Reminder (values.yaml security note): keep this host on a private network —
# VPN or IP-allowlisted — and behind TLS. Never expose KubeMind to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubemind.fullname" . }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- if $forwardHost }}
        # Needs a certificate valid for the wildcard too — see portForward in values.yaml.
        - {{ printf "*.%s" $forwardHost | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # The frontend service proxies /api and /ws to the backend —
                # one upstream, so WebSockets and SSE need no ingress tuning here.
                name: {{ include "kubemind.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- if $forwardHost }}
    # One origin per port-forward session (<session-id>.<host>). Same upstream:
    # the frontend's nginx hands these hosts to the backend whole.
    - host: {{ printf "*.%s" $forwardHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubemind.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
{{- end }}
