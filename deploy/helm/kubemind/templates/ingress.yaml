{{- if .Values.ingress.enabled }}
# Reminder (values.yaml security note): keep this host on a private network —
# VPN or IP-allowlisted — and behind TLS. Never expose KubeMind to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubemind.fullname" . }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # The frontend service proxies /api and /ws to the backend —
                # one upstream, so WebSockets and SSE need no ingress tuning here.
                name: {{ include "kubemind.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
