apiVersion: v2
name: kubemind
description: >-
  KubeMind — web-based, AI-assisted Kubernetes dashboard. Deploys the backend
  (Spring Boot) and frontend (nginx) plus, optionally, a pgvector-enabled
  PostgreSQL and an Ollama instance so a bare `helm install` yields a fully
  working system.
