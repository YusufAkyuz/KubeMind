# KubeMind Helm chart values.
#
# SECURITY — READ BEFORE INSTALLING
# =================================
# 1. Choose a privilege mode with `rbac.clusterAdmin` below.
#
#    true  (default) — the backend ServiceAccount is bound to `cluster-admin`.
#      Three features need this and cannot be made to work without it: the
#      Cluster Terminal (provisions its own cluster-admin ServiceAccount), the
#      Node Shell (privileged host-mounted debug pods), and creating RBAC
#      objects. Anyone who can log in as an ADMIN effectively holds
#      cluster-admin on this cluster.
#
#    false — restricted mode. The chart binds a narrower role instead (see
#      templates/clusterrole-restricted.yaml) and the app switches those three
#      features off, so the UI never offers what the API server would refuse.
#      Everything else still works: browsing, scaling, restarting, editing
#      YAML for the allowlisted kinds, pod terminals, logs, Helm and the AI
#      features. Restricted mode still reads Secrets cluster-wide and can exec
#      into pods — read that template's header before assuming it is safe for
#      your environment.
#
#    Writing RBAC objects is never part of restricted mode: whoever can create
#    a RoleBinding can grant themselves cluster-admin, so allowing it would be
#    the same power wearing a costume.
# 2. NEVER expose KubeMind directly to the internet. Put it behind your
#    ingress with TLS and network-level access control (VPN/allowlist), or
#    keep ingress disabled and access it via `kubectl port-forward`.

image:
  backend:
    repository: kubemind/backend
    tag: 0.3.1
    pullPolicy: IfNotPresent
  frontend:
    repository: kubemind/frontend
    tag: 0.3.1
    pullPolicy: IfNotPresent
  # imagePullSecrets: [{ name: my-registry-secret }]
  imagePullSecrets: []

# Login sessions are in-memory (JSESSIONID) — more than 1 backend replica needs
# sticky sessions on your ingress, which this chart does not configure for you.
replicaCount: 1

auth:
  # First-login admin user, seeded on startup. REQUIRED — the chart refuses to
  # render without a password so no deployment ever ships a default credential.
  adminUsername: admin
  adminPassword: ""
  # base64-encoded 32 bytes (`openssl rand -base64 32`). Encrypts stored
  # kubeconfigs of registered remote clusters. Leave empty to disable remote
  # cluster registration (the built-in local cluster keeps working).
  encryptionKey: ""
  # Alternatively, point at an existing Secret with keys:
  #   admin-password, encryption-key, oidc-client-secret (only oidc-client-secret is optional)
  existingSecret: ""
  # Optional OIDC/SSO login, additive to the admin/password login above —
  # both stay available together. Blank issuerUri means OIDC is entirely off,
  # same as leaving KUBEMIND_OIDC_ISSUER_URI unset in backend/.env for local dev.
  #
  # An unreachable identity provider does not block startup: discovery happens
  # on the first SSO click rather than at boot, so a pod restarting during an
  # IdP outage still comes up and adminPassword above still gets you in. Keep
  # that password set even when SSO is your normal path — it is the way back in.
  oidc:
    issuerUri: ""
    clientId: ""
    clientSecret: ""
    # Claim carrying the caller's IdP groups, for the admin-group mapping below.
    groupsClaim: groups
    # A group name in that claim that maps a first-time OIDC login to ADMIN.
    # Blank -> every new OIDC account starts as USER; promote via the existing
    # Users admin page afterward, same as any local account.
    adminGroup: ""

# ── Kubernetes user impersonation ─────────────────────────────────────────────
# enabled: false (default) -> KubeMind acts against this cluster as its own
#   ServiceAccount, and the built-in cluster stays ADMIN-only (there is no
#   per-user scope to grant when everyone shares one identity).
#
# enabled: true -> every call carries the caller's own identity
#   (Impersonate-User / Impersonate-Group), so Kubernetes RBAC decides what each
#   person may do and the API server's audit log names the real human. The
#   built-in cluster then opens to ALL logged-in users, because the cluster
#   itself — not this app — is doing the scoping.
#
# READ BEFORE ENABLING:
# * Requires rbac.clusterAdmin: true. Restricted mode holds no impersonate
#   permission, so this combination is rejected at render time rather than
#   installed broken.
# * Local accounts are impersonated too, the seeded admin included. Without an
#   RBAC binding carrying their name they lose access to the built-in cluster
#   the moment this flips — which is what bootstrapAdminBinding prevents.
impersonation:
  enabled: false
  # Binds auth.adminUsername to cluster-admin so enabling impersonation never
  # leaves the install with nobody able to administer it. This is a REAL grant
  # of cluster-admin to that username — set it to false and create your own
  # narrower binding if you'd rather the seeded admin not hold it.
  # Rendered only when impersonation.enabled is true.
  bootstrapAdminBinding: true

rbac:
  # true  -> bind cluster-admin; Cluster Terminal, Node Shell and RBAC writes work.
  # false -> restricted mode; those three are switched off app-wide and a narrower
  #          ClusterRole is bound instead. See the security note at the top of
  #          this file, and templates/clusterrole-restricted.yaml for exactly
  #          what restricted mode grants.
  # This value also drives KUBEMIND_PRIVILEGED_FEATURES on the backend, so the
  # app and the RBAC it runs under can never disagree.
  clusterAdmin: true

serviceAccount:
  create: true
  name: ""

# ── PostgreSQL (pgvector) ──────────────────────────────────────────────────────
# enabled: true  → the chart deploys a single-node pgvector-enabled PostgreSQL.
# enabled: false → fill in `external` with your own database's connection info.
#                  Your DB must have the `vector` and `uuid-ossp` extensions
#                  installed (see backend/src/main/resources/db/migration/V6).
postgresql:
  enabled: true
  image: pgvector/pgvector:pg16
  database: kubemind
  username: kubemind
  # REQUIRED when enabled and no existingSecret (key: db-password) is set.
  password: ""
  storage:
    size: 5Gi
    # storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  external:
    # Used only when enabled: false. jdbcUrl example:
    #   jdbc:postgresql://mydb.example.com:5432/kubemind
    jdbcUrl: ""
    username: ""
    password: ""

# ── Ollama (local AI model) ────────────────────────────────────────────────────
# enabled: true  → the chart deploys Ollama and pulls the models on first start
#                  (chat model ~4.7GB — the first startup takes a while).
# enabled: false → fill in `external.baseUrl` with a reachable Ollama endpoint.
ollama:
  enabled: true
  image: ollama/ollama:latest
  chatModel: qwen2.5-coder:7b
  embeddingModel: nomic-embed-text
  # Pull the models automatically when the pod starts. Disable if you preload
  # models into the volume yourself.
  pullModelsOnStart: true
  storage:
    size: 20Gi
    # storageClassName: ""
  # The 7B chat model wants ~6-8GB of memory. Adjust to your node capacity.
  resources:
    requests: { cpu: "1", memory: 6Gi }
    limits: { memory: 10Gi }
  external:
    baseUrl: ""

backend:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  # Extra environment variables for the backend container.
  extraEnv: []

frontend:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: kubemind.example.internal
  annotations: {}
  tls:
    enabled: false
    secretName: kubemind-tls

nodeSelector: {}
tolerations: []
affinity: {}
