name: Publish Helm repo

# Packages the chart and (re)publishes docs/index.yaml whenever Chart.yaml's
# version changes on main — that's what makes `helm repo add kubemind
# https://<owner>.github.io/KubeMind` work. GitHub Pages must be configured
# to serve from the main branch's /docs folder (Settings > Pages).
on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/kubemind/Chart.yaml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart into docs/
        run: helm package deploy/helm/kubemind -d docs/

      - name: Update repo index
        run: |
          helm repo index docs \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} \
            --merge docs/index.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish Helm chart $(grep '^version:' deploy/helm/kubemind/Chart.yaml | awk '{print $2}')"
          git push
