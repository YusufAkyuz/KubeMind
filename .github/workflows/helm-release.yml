name: Publish Helm repo

# Packages the chart and (re)publishes docs/index.yaml whenever Chart.yaml's
# version changes on main — that's what makes `helm repo add kubemind
# https://<owner>.github.io/KubeMind` work. GitHub Pages must be configured
# to serve from the main branch's /docs folder (Settings > Pages).
on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/kubemind/Chart.yaml"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Read chart version
        id: chart-version
        run: echo "version=$(grep '^version:' deploy/helm/kubemind/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart into docs/
        run: helm package deploy/helm/kubemind -d docs/

      - name: Update repo index
        run: |
          helm repo index docs \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} \
            --merge docs/index.yaml

      # main is protected (PRs + status checks required), so the bot can't push
      # directly — open a PR instead. The chart version doesn't change again
      # until the next release, so this only fires on an actual bump.
      - name: Open PR with the published chart
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: publish Helm chart ${{ steps.chart-version.outputs.version }}"
          title: "chore: publish Helm chart ${{ steps.chart-version.outputs.version }}"
          body: Auto-generated by the Publish Helm repo workflow — packages the chart and updates `docs/index.yaml`.
          branch: helm-release/${{ steps.chart-version.outputs.version }}
          add-paths: docs/
          delete-branch: true
