name: Release

# One trigger ships a version: a vX.Y.Z tag on a commit that is already on
# develop. Everything downstream — images, main, the Helm chart, the GitHub
# release — follows from that tag, in an order chosen so a failure never leaves
# main advertising a release whose artifacts don't exist.
#
# develop is the default branch and the only place work lands. main is the
# released line: this workflow is what moves it, so nobody merges into it by
# hand. It needs a RELEASE_TOKEN secret (a PAT owned by a repo admin) because
# main is protected and GITHUB_TOKEN cannot push through that.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag is releasable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      # Checked before anything is built or pushed: without it the promote job
      # would fail at the very end, after images are already public.
      - name: RELEASE_TOKEN must be configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is missing — promote cannot push to protected main."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need develop's history to prove the tag came from it

      # Strips the leading "v" so v0.2.2 yields image/chart version 0.2.2.
      # ^{commit} resolves annotated tags to the commit they wrap, so the rest
      # of the workflow works the same either way.
      - name: Resolve the tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" >> "$GITHUB_OUTPUT"

      # A tag can be pushed onto any commit on any branch. Releasing one that
      # never landed on develop would ship code no CI run ever saw.
      - name: Tag must sit on develop
        env:
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          if ! git merge-base --is-ancestor "$COMMIT" origin/develop; then
            echo "::error::$GITHUB_REF_NAME points at $COMMIT, which is not on develop."
            echo "::error::Merge the work into develop first, then tag a develop commit."
            exit 1
          fi

      # The chart is published straight from this commit and pins appVersion to
      # the image tag, so a version left un-bumped would publish a chart that
      # points at images this release never built. frontend/package.json is
      # deliberately not checked — it isn't tracked as the product version.
      - name: Chart and backend versions must match the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chart=deploy/helm/kubemind/Chart.yaml
          fail=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 is '$2', expected '$VERSION'"
              fail=1
            fi
          }
          check "Chart.yaml version"    "$(grep '^version:'    "$chart" | awk '{print $2}' | tr -d '\"')"
          check "Chart.yaml appVersion" "$(grep '^appVersion:' "$chart" | awk '{print $2}' | tr -d '\"')"
          check "backend/pom.xml version" \
            "$(sed -n '/<artifactId>kubemind-backend<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;}' backend/pom.xml)"
          exit $fail

  images:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Build from the tagged commit, not a branch head, so the images are
      # exactly what was verified above.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kubemind/backend:${{ needs.verify.outputs.version }}
            kubemind/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kubemind/frontend:${{ needs.verify.outputs.version }}
            kubemind/frontend:latest

  promote:
    name: Promote to main and publish the chart
    # Runs only once the images are public: the chart it publishes references
    # them by tag, so advertising the chart first would point users at images
    # that don't exist yet.
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # A merge, not a fast-forward: main carries release commits (the published
      # chart below) that develop never gets, so the two branches are
      # permanently divergent by design and only a merge can reconcile them.
      # Re-running on an already-promoted tag is a no-op.
      - name: Merge the release into main
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit: this checkout is of main, and $COMMIT lives on develop.
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          if ! git merge --no-ff "$COMMIT" -m "chore(release): $GITHUB_REF_NAME"; then
            git merge --abort || true
            echo "::error::main conflicts with $GITHUB_REF_NAME. Merge main into develop by hand, re-tag, and retry."
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Publishes to the Helm repo GitHub Pages serves from main's /docs — this
      # is what keeps `helm repo add kubemind https://<owner>.github.io/KubeMind`
      # working. --merge keeps the previous versions in the index.
      - name: Package the chart into docs/
        run: |
          helm package deploy/helm/kubemind -d docs/
          helm repo index docs \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} \
            --merge docs/index.yaml

      - name: Commit the published chart
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git add docs/
          git diff --cached --quiet \
            || git commit -m "chore(release): publish Helm chart $VERSION"

      - name: Push main
        run: git push origin HEAD:main

      # Last, so the release notes only appear once everything behind them is
      # actually shipped. Left alone if it already exists (hand-written notes,
      # or a re-run).
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it as is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
