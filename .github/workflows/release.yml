name: Release images

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Strips the leading "v" so a tag like v0.1.0 produces image tag 0.1.0,
      # matching the Chart.yaml appVersion convention.
      - name: Compute image tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kubemind/backend:${{ steps.version.outputs.tag }}
            kubemind/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kubemind/frontend:${{ steps.version.outputs.tag }}
            kubemind/frontend:latest
